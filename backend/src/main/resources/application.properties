spring.application.name=m2-manager-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/m2manager
spring.datasource.username=m2manager
spring.datasource.password=m2manager_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# Actuator / health - na razie później dodamy actuator
management.endpoints.web.exposure.include=health,info